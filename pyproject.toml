[project]
name = "hermes-apron"
version = "0.1.0"
description = "Closed enrollment Apron integration for Hermes"
requires-python = ">=3.14"
license = "MIT"
dependencies = ["websockets==16.0"]

[dependency-groups]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "playwright==1.64.1", "ruff==0.15.22", "pyyaml==6.0.3", "ruamel.yaml==0.19.1", "httpx2==2.16.0", "rich==15.0.0", "python-dotenv==1.2.4", "platformdirs==4.14.5", "tenacity==9.2.1", "jinja2==3.1.6", "prompt-toolkit==3.0.53", "psutil==7.2.2", "pydantic==2.14.3", "croniter==7.0.0"]

[build-system]
requires = ["setuptools==84.1.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["hermes_apron*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ASYNC110"]
