name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, Node 24
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6, Node 24
        with:
          go-version: '1.27.3'
          cache: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6, Node 24
        with:
          node-version: '24'
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7, Node 24
        with:
          version: '0.13.0'
          python-version: '3.14'
          enable-cache: false
      - name: Isolated scratch and browser
        run: |
          echo "TMPDIR=$RUNNER_TEMP/apron-scratch" >> "$GITHUB_ENV"
          mkdir -m 700 "$RUNNER_TEMP/apron-scratch"
          uv run --group dev playwright install --with-deps chromium
          echo "CHROMIUM_EXECUTABLE=$(uv run --group dev python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')" >> "$GITHUB_ENV"
      - name: Race tests, real upstream, lint, build and content audit
        run: |
          tools/go test -race ./...
          tools/upstream-test
          tools/go vet ./...
          test -z "$(gofmt -l cmd internal)"
          uv run --group dev ruff check hermes_apron tests tools/*.py __init__.py
          uv run --group dev ruff format --check hermes_apron tests tools/*.py __init__.py
          tools/go build ./cmd/apron-home
          rm apron-home
          python3 tools/audit.py
      - name: Pinned local frontend and real browser/plugin tests
        run: |
          frontend=$(tools/frontend --test)
          HERMES_APRON_FRONTEND_DIR="$frontend" tools/test -q
